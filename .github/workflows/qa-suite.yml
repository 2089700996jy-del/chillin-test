name: Chillin QA Suite

# 跨仓库自动闭环工作流：
# 1. repository_dispatch (chillin-updated): 由 Chillin CI 成功后触发，精确检出 client_payload.sha，按变更影响分析决定测试范围。
# 2. workflow_dispatch: 支持手动选择 auto(按变更分析) | smoke | core | full，并可指定 chillin_ref。
# 3. schedule: 每日夜间全量回归 (full)。
# 注意：若 2089700996jy-del/chillin 为私有仓库，需在 chillin-test 仓库配置 Secret: CHILLIN_READ_TOKEN。

on:
  workflow_dispatch:
    inputs:
      tier:
        description: 'Execution tier (auto | smoke | core | full)'
        required: true
        default: 'auto'
        type: choice
        options: [auto, smoke, core, full]
      chillin_ref:
        description: 'Chillin branch or SHA'
        required: false
        default: 'main'
  schedule:
    - cron: '0 19 * * *' # 北京时间凌晨 03:00 夜间全量回归
  repository_dispatch:
    types: [chillin-updated]

jobs:
  qa-run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout chillin-test
        uses: actions/checkout@v4
        with:
          path: chillin-test

      - name: Checkout chillin (exact target commit)
        uses: actions/checkout@v4
        with:
          repository: 2089700996jy-del/chillin
          ref: ${{ github.event.client_payload.sha || github.event.inputs.chillin_ref || 'main' }}
          token: ${{ secrets.CHILLIN_READ_TOKEN || github.token }}
          fetch-depth: 0
          path: chillin

      - name: Verify exact Chillin commit checkout
        working-directory: chillin
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          EXPECTED_SHA="${{ github.event.client_payload.sha }}"
          echo "Checked out Chillin SHA: $ACTUAL_SHA"
          if [ -n "$EXPECTED_SHA" ] && [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Checkout mismatch! Expected $EXPECTED_SHA, got $ACTUAL_SHA"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          cd chillin && npm ci
          cd ../chillin-test && npm ci
          npx playwright install chromium

      - name: Run Chillin L1 unit/integration gate
        id: l1_gate
        working-directory: chillin
        run: npm test

      - name: Analyze change impact
        id: impact
        working-directory: chillin-test
        env:
          CHILLIN_ROOT: ${{ github.workspace }}/chillin
        run: |
          BASE_REF="${{ github.event.client_payload.before || 'HEAD~1' }}"
          HEAD_REF="${{ github.event.client_payload.sha || 'HEAD' }}"
          node scripts/analyze-impact.mjs --base "$BASE_REF" --head "$HEAD_REF"

      - name: Resolve execution tier
        id: resolve_tier
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TIER="full"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.tier }}" != "auto" ]; then
            TIER="${{ github.event.inputs.tier }}"
          else
            TIER="${{ steps.impact.outputs.tier || 'core' }}"
          fi
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"
          echo "Selected QA tier: $TIER (impact=${{ steps.impact.outputs.tier }}, event=${{ github.event_name }})"

      - name: Run L2 integration tests
        if: steps.resolve_tier.outputs.tier == 'core' || steps.resolve_tier.outputs.tier == 'full'
        working-directory: chillin-test
        env:
          CHILLIN_ROOT: ${{ github.workspace }}/chillin
          QA_TIER: ${{ steps.resolve_tier.outputs.tier }}
        run: npm run test:l2

      - name: Run Playwright E2E suite
        working-directory: chillin-test
        env:
          CHILLIN_ROOT: ${{ github.workspace }}/chillin
          QA_TIER: ${{ steps.resolve_tier.outputs.tier }}
        run: |
          TIER="${{ steps.resolve_tier.outputs.tier }}"
          if [ "$TIER" = "smoke" ]; then
            npm run test:smoke
          elif [ "$TIER" = "core" ]; then
            npm run test:core
          else
            npm test
          fi

      - name: Publish QA report to GitHub Step Summary
        if: always()
        run: |
          if [ -f "chillin-test/test-results/bug-report.md" ]; then
            node -e '
              const fs = require("fs");
              const raw = fs.readFileSync("chillin-test/test-results/bug-report.md", "utf8");
              const limit = 512 * 1024;
              const out = raw.length > limit
                ? raw.slice(0, limit) + "\n\n> ⚠️ 报告已截断（超出 GitHub Step Summary 安全上限），完整内容请下载下方 Artifact。\n"
                : raw;
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + "\n", "utf8");
            '
          else
            {
              echo "## Chillin QA Report"
              echo "No bug-report.md generated (L1 or setup failed before Playwright run)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload QA summary (lightweight, 3 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chillin-qa-report-${{ steps.resolve_tier.outputs.tier }}
          retention-days: 3
          path: |
            chillin-test/test-results/bug-report.md
            chillin-test/.tmp/impact-report.json

      - name: Upload Playwright debug report on failure (3 days)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chillin-qa-debug-${{ steps.resolve_tier.outputs.tier }}
          retention-days: 3
          path: |
            chillin-test/playwright-report/
